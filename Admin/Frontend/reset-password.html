<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - Compunic</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="js/auth.js"></script>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0a1628;
            color: #e2e8f0;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Background */
        .bg-particles {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }

        .bg-particles .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: orbFloat 20s ease-in-out infinite;
        }

        .bg-particles .orb:nth-child(1) {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #145D90, transparent 70%);
            top: -150px;
            left: -100px;
        }

        .bg-particles .orb:nth-child(2) {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #56A5DD, transparent 70%);
            bottom: -100px;
            right: -50px;
            animation-delay: -7s;
            animation-duration: 25s;
        }

        .bg-particles .orb:nth-child(3) {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #1a3a5c, transparent 70%);
            top: 50%;
            left: 40%;
            animation-delay: -14s;
            animation-duration: 30s;
        }

        @keyframes orbFloat {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            25% {
                transform: translate(30px, -40px) scale(1.05);
            }

            50% {
                transform: translate(-20px, 20px) scale(0.95);
            }

            75% {
                transform: translate(15px, 30px) scale(1.02);
            }
        }

        .bg-particles .dot {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(86, 165, 221, 0.5);
            border-radius: 50%;
            animation: dotDrift linear infinite;
        }

        @keyframes dotDrift {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translateY(-100px) scale(1);
                opacity: 0;
            }
        }

        .bg-grid {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image:
                linear-gradient(rgba(86, 165, 221, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(86, 165, 221, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        /* Card */
        .forgot-card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 480px;
            background: rgba(12, 22, 42, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 24px;
            padding: 3rem;
            border: 1px solid rgba(86, 165, 221, 0.15);
            box-shadow:
                0 0 40px rgba(86, 165, 221, 0.05),
                0 25px 50px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            animation: fadeSlideUp 0.8s ease-out;
            text-align: center;
            margin: 2rem;
        }

        .forgot-card:hover {
            animation: glowPulse 3s ease-in-out infinite;
        }

        /* Header */
        .forgot-header .forgot-icon {
            width: 68px;
            height: 68px;
            border-radius: 20px;
            background: linear-gradient(135deg, #145D90, #56A5DD);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.25rem;
            font-size: 1.7rem;
            color: white;
            box-shadow: 0 8px 25px rgba(20, 93, 144, 0.35);
        }

        .forgot-header .forgot-icon.warning {
            background: linear-gradient(135deg, #e67e22, #f39c12);
            box-shadow: 0 8px 25px rgba(230, 126, 34, 0.35);
        }

        .forgot-header h2 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 0.5rem;
        }

        .forgot-header p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        /* Password Requirements */
        .password-requirements {
            text-align: left;
            background: rgba(255, 255, 255, 0.05);
            padding: 1rem 1.25rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .password-requirements strong {
            color: #ffffff;
            display: block;
            margin-bottom: 0.5rem;
        }

        .password-requirements ul {
            margin: 0;
            padding-left: 1.2rem;
        }

        .password-requirements li {
            margin: 0.25rem 0;
        }

        /* Form */
        .form-group {
            margin-bottom: 1.25rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 500;
            font-size: 0.85rem;
            letter-spacing: 0.3px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper .input-icon {
            position: absolute;
            left: 14px;
            color: rgba(86, 165, 221, 0.5);
            font-size: 1rem;
            pointer-events: none;
            transition: color 0.3s;
        }

        .input-wrapper input {
            width: 100%;
            padding: 0.9rem 1rem 0.9rem 2.75rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(86, 165, 221, 0.15);
            border-radius: 12px;
            font-size: 0.95rem;
            font-family: inherit;
            color: #e2e8f0;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        .input-wrapper input:focus {
            border-color: #56A5DD;
            background: rgba(86, 165, 221, 0.08);
            box-shadow: 0 0 0 3px rgba(86, 165, 221, 0.1), 0 0 20px rgba(86, 165, 221, 0.05);
        }

        .input-wrapper input:focus~.input-icon {
            color: #56A5DD;
        }

        .input-error {
            border-color: #ff6b6b !important;
            box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.15) !important;
        }

        /* Checkbox */
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            justify-content: flex-start;
        }

        .checkbox-group input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #56A5DD;
            cursor: pointer;
        }

        .checkbox-group label {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.85rem;
            cursor: pointer;
            user-select: none;
            margin: 0;
            font-weight: normal;
        }

        /* Button */
        .btn-primary {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, #145D90, #56A5DD);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transform: translateX(-100%);
            transition: transform 0.5s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(20, 93, 144, 0.5);
        }

        .btn-primary:hover::before {
            transform: translateX(100%);
        }

        .btn-primary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Messages */
        .message {
            margin-top: 1rem;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 500;
            display: none;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }

        .message.success {
            background: rgba(46, 204, 113, 0.12);
            color: #6ee7a0;
            border: 1px solid rgba(46, 204, 113, 0.25);
        }

        .message.error {
            background: rgba(255, 107, 107, 0.1);
            color: #ff6b6b;
            border: 1px solid rgba(255, 107, 107, 0.2);
        }

        /* Back link */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 1.5rem;
            color: rgba(86, 165, 221, 0.7);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #56A5DD;
        }

        /* Loading Spinner */
        .loading-spinner {
            display: none;
            text-align: center;
            padding: 2rem;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-left-color: #56A5DD;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Footer */
        .forgot-footer {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.25rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.2);
            font-size: 0.75rem;
        }

        /* Animations */
        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes glowPulse {

            0%,
            100% {
                box-shadow: 0 0 40px rgba(86, 165, 221, 0.05), 0 25px 50px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            }

            50% {
                box-shadow: 0 0 60px rgba(86, 165, 221, 0.1), 0 25px 50px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            }
        }

        /* Responsive */
        @media (max-width: 480px) {
            body {
                overflow: auto;
            }

            .forgot-card {
                padding: 2rem 1.5rem;
                margin: 1rem;
                border-radius: 20px;
            }

            .forgot-header .forgot-icon {
                width: 56px;
                height: 56px;
                font-size: 1.4rem;
                border-radius: 16px;
            }

            .forgot-header h2 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>

<body>
    <!-- Fondo fachero y animaciones de fondo ✨ -->
    <div class="bg-particles">
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
    </div>
    <div class="bg-grid"></div>

    <!-- Card -->
    <div class="forgot-card">
        <!-- Loading State -->
        <div id="loadingState" class="loading-spinner">
            <div class="spinner"></div>
            <p style="margin-top: 1rem; color: rgba(255,255,255,0.6);">Validando enlace...</p>
        </div>

        <!-- Main Form -->
        <div id="mainContent" style="display: none;">
            <div class="forgot-header">
                <div class="forgot-icon">
                    <i class="fas fa-lock"></i>
                </div>
                <h2>Nueva Contraseña</h2>
                <p id="usernameDisplay"></p>
            </div>

            <form id="resetForm">
                <div class="password-requirements">
                    <strong>Requisitos de contraseña:</strong>
                    <ul>
                        <li>Mínimo 8 caracteres</li>
                        <li>Obligatorio: letras y números</li>
                    </ul>
                </div>

                <div class="form-group">
                    <label for="newPassword">Nueva Contraseña</label>
                    <div class="input-wrapper">
                        <i class="fas fa-key input-icon"></i>
                        <input type="password" id="newPassword" placeholder="Ingresa tu nueva contraseña" required minlength="8">
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirmar Contraseña</label>
                    <div class="input-wrapper">
                        <i class="fas fa-check-circle input-icon"></i>
                        <input type="password" id="confirmPassword" placeholder="Confirma tu nueva contraseña" required minlength="8">
                    </div>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="showPasswords">
                    <label for="showPasswords">Mostrar contraseñas</label>
                </div>

                <button type="submit" class="btn-primary" id="submitBtn">
                    <i class="fas fa-save"></i>
                    <span>Restablecer Contraseña</span>
                </button>
                <div id="message" class="message"></div>
            </form>
        </div>

        <!-- Error State -->
        <div id="errorState" style="display: none;">
            <div class="forgot-header">
                <div class="forgot-icon warning">
                    <i class="fas fa-exclamation-triangle"></i>
                </div>
                <h2>Enlace Inválido</h2>
                <p id="errorMessage"></p>
            </div>
            
            <a href="forgot-password.html" class="btn-primary" style="display: inline-flex; text-decoration: none; margin-top: 1rem;">
                <i class="fas fa-paper-plane"></i>
                <span>Solicitar Nuevo Enlace</span>
            </a>
        </div>

        <a href="index.html" class="back-link" style="display: block; margin: 1.5rem auto 0; text-align: center;">
            <i class="fas fa-arrow-left"></i>
            Volver al inicio de sesión
        </a>

        <div class="forgot-footer">
            © 2026 Compunic · Todos los derechos reservados
        </div>
    </div>

    <script>
        // Floating dots
        (function createDots() {
            const container = document.querySelector('.bg-particles');
            for (let i = 0; i < 25; i++) {
                const dot = document.createElement('div');
                dot.className = 'dot';
                dot.style.left = Math.random() * 100 + '%';
                dot.style.animationDuration = (8 + Math.random() * 15) + 's';
                dot.style.animationDelay = Math.random() * 10 + 's';
                dot.style.width = dot.style.height = (2 + Math.random() * 3) + 'px';
                container.appendChild(dot);
            }
        })();

        // Logica para mostrar contraseña
        document.getElementById('showPasswords').addEventListener('change', function () {
            const newPass = document.getElementById('newPassword');
            const confirmPass = document.getElementById('confirmPassword');
            const type = this.checked ? 'text' : 'password';
            newPass.type = type;
            confirmPass.type = type;
        });

        // Validación en tiempo real
        const newPassInput = document.getElementById('newPassword');
        const confirmPassInput = document.getElementById('confirmPassword');

        function validarCoincidencia() {
            const pass1 = newPassInput.value;
            const pass2 = confirmPassInput.value;

            // Solo validar si el campo de confirmación tiene algo escrito
            if (pass2.length > 0) {
                if (pass1 !== pass2) {
                    confirmPassInput.classList.add('input-error');
                } else {
                    confirmPassInput.classList.remove('input-error');
                }
            } else {
                confirmPassInput.classList.remove('input-error');
            }
        }

        // Escuchar cambios en ambos campos
        newPassInput.addEventListener('input', validarCoincidencia);
        confirmPassInput.addEventListener('input', validarCoincidencia);

        // Obtener token de la URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        const loadingState = document.getElementById('loadingState');
        const mainContent = document.getElementById('mainContent');
        const errorState = document.getElementById('errorState');

        // Validar token al cargar la página
        async function validateTokenOnLoad() {
            if (!token) {
                showError('No se proporcionó un token de recuperación válido.');
                return;
            }

            loadingState.style.display = 'block';

            try {
                const result = await Auth.validateToken(token);

                if (result.valid) {
                    // Token válido - mostrar formulario
                    document.getElementById('usernameDisplay').textContent = `Usuario: ${result.username}`;
                    loadingState.style.display = 'none';
                    mainContent.style.display = 'block';
                } else {
                    // Token inválido
                    showError(result.error || 'El enlace de recuperación es inválido o ha expirado.');
                }
            } catch (error) {
                showError('Error al validar el enlace de recuperación.');
            }
        }

        function showError(message) {
            loadingState.style.display = 'none';
            errorState.style.display = 'block';
            document.getElementById('errorMessage').textContent = message;
        }

        // Manejar envío del formulario
        document.getElementById('resetForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const submitBtn = document.getElementById('submitBtn');
            const messageDiv = document.getElementById('message');

            // Validar que las contraseñas coincidan
            if (newPassword !== confirmPassword) {
                messageDiv.className = 'message error';
                messageDiv.textContent = '❌ Las contraseñas no coinciden';
                messageDiv.style.display = 'block';
                return;
            }

            // Validar longitud mínima
            if (newPassword.length < 8) {
                messageDiv.className = 'message error';
                messageDiv.textContent = '❌ La contraseña debe tener al menos 8 caracteres';
                messageDiv.style.display = 'block';
                return;
            }

            // Validar complejidad (letras y números)
            const strongPasswordRegex = /^(?=.*[a-zA-Z])(?=.*\d)/;
            if (!strongPasswordRegex.test(newPassword)) {
                messageDiv.className = 'message error';
                messageDiv.textContent = '❌ Su contraseña es muy débil. Debe combinar letras y números.';
                messageDiv.style.display = 'block';
                return;
            }

            // Deshabilitar botón mientras se procesa
            submitBtn.disabled = true;
            submitBtn.querySelector('span').textContent = 'Restableciendo...';
            messageDiv.style.display = 'none';

            try {
                const result = await Auth.resetPassword(token, newPassword);

                if (result.success) {
                    messageDiv.className = 'message success';
                    messageDiv.textContent = '✅ ' + result.message;
                    messageDiv.style.display = 'block';

                    // Limpiar formulario
                    document.getElementById('resetForm').reset();

                    // Redirigir al login después de 3 segundos
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 3000);
                } else {
                    messageDiv.className = 'message error';
                    messageDiv.textContent = '❌ ' + result.message;
                    messageDiv.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.querySelector('span').textContent = 'Restablecer Contraseña';
                }
            } catch (error) {
                messageDiv.className = 'message error';
                messageDiv.textContent = '❌ Error de conexión con el servidor';
                messageDiv.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.querySelector('span').textContent = 'Restablecer Contraseña';
            }
        });

        // Validar token al cargar
        validateTokenOnLoad();
    </script>
</body>

</html>
