<div class="container">

  <!-- Formulario CRUD -->
  <section class="formulario" id="seccion-formulario">
    <h2>Gestión de Clientes</h2>
    <form id="formulario-clientes">
      <div class="input-with-icon">
        <span class="input-icon">👤</span>
        <input id="NOMBRE" type="text" placeholder="Nombre del cliente" required />
      </div>
      <div class="input-with-icon">
        <span class="input-icon">👤</span>
        <input id="APELLIDO" type="text" placeholder="Apellido del cliente" required />
      </div>
      <div class="input-with-icon">
        <span class="input-icon">📞</span>
        <input id="TELEFONO" type="text" placeholder="Teléfono del cliente" required />
      </div>
      <div class="input-with-icon">
        <span class="input-icon">📧</span>
        <input id="EMAIL" type="text" placeholder="Email del cliente" required />
      </div>

      <div style="display: flex; gap: 10px; justify-content: center; margin-top: 15px;">
        <button id="btn_agregar_cliente" type="button" style="flex: 1; max-width: 120px;">Agregar</button>
        <button id="btn_modificar_cliente" type="button" style="flex: 1; max-width: 120px;">Modificar</button>
        <button id="btn_eliminar_cliente" type="button" style="flex: 1; max-width: 120px;">Eliminar</button>
      </div>
    </form>
  </section>

  <!-- Sección de Búsqueda -->
  <section class="busqueda" id="seccion-busqueda">
    <h2>Buscar clientes</h2>
    <div style="display: flex; gap: 10px; align-items: center;">
      <div class="input-with-icon" style="flex: 1;">
        <span class="input-icon">🔍</span>
        <input id="buscar_nombre" type="text" placeholder="Buscar por nombre, apellido, tel, email..." />
      </div>
      <button id="btn_buscar_cliente" type="button">Buscar</button>
    </div>
  </section>

  <!-- Tabla de resultados -->
  <section class="tabla" id="seccion-tabla">
    <h2>Lista de Clientes</h2>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Apellido</th>
          <th>Teléfono</th>
          <th>Email</th>
        </tr>
      </thead>
      <tbody id="tablaClientes">
      </tbody>
    </table>
  </section>

</div>
