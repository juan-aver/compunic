<div class="container">

    <!-- Sección de formulario - se puede ocultar -->
    <section class="formulario" id="seccion-formulario">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 10px;">
            <h2 style="margin: 0; display: flex; align-items: center; gap: 8px;">
                <i class="fas fa-shield-alt" style="color: #ea580c;"></i> Gestión de Garantías
            </h2>
            <div style="display: flex; gap: 8px; align-items: center;">
                <button type="button" id="btn-ver-tipos-garantia"
                    style="background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; border: none; padding: 7px 15px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; gap: 6px;"
                    onclick="if (typeof abrirModalTiposGarantia === 'function') abrirModalTiposGarantia();">
                    <i class="fas fa-info-circle"></i> Ver Tipos de Garantías
                </button>
                <button type="button" id="btn-toggle-form-garantia"
                    style="background: #6c757d; color: white; border: none; padding: 7px 14px; border-radius: 6px; cursor: pointer; font-size: 0.85rem;"
                    onclick="toggleFormularioGarantia()">
                    <i class="fas fa-eye-slash"></i> Ocultar Formulario
                </button>
            </div>
        </div>
        <form id="formulario-garantias">

            <!-- ID Auto-generado (oculto) -->
            <input type="hidden" id="ID_GARANTIA" />

            <div class="input-with-icon">
                <span class="input-icon">📅</span>
                <input type="number" id="DURACION_MESES" placeholder="Duración (Meses)" required />
            </div>

            <select id="ID_GARANTIA_TIPO">
                <option value="">Seleccione Tipo...</option>
            </select>

            <select id="ID_GARANTIA_ESTADO">
                <option value="">Seleccione Estado...</option>
            </select>

            <div class="input-with-icon">
                <span class="input-icon">✅</span>
                <input id="CONDICION" type="text" placeholder="Condición" />
            </div>
            <div class="input-with-icon">
                <span class="input-icon">❌</span>
                <input id="EXCLUSIONES" type="text" placeholder="Exclusiones" />
            </div>

            <!-- Botones: Agregar siempre visible, Modificar/Eliminar solo admin -->
            <div style="display: flex; gap: 10px; justify-content: center; margin-top: 10px;">
                <button id="btn_agregar_garantia" type="button"
                    style="flex: 1; max-width: 140px;">Agregar</button>
                <!-- Modificar solo para admins - visible/oculto por JS -->
                <button id="btn_modificar_garantia" type="button"
                    style="flex: 1; max-width: 140px; display: none;">Modificar</button>
                <button id="btn_limpiar_garantia" type="button"
                    style="flex: 1; max-width: 120px; background-color: #7f8c8d;">Limpiar</button>
            </div>
        </form>
    </section>

    <section class="busqueda" id="seccion-busqueda">
        <h2>Buscar Garantía</h2>
        <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
            <select id="buscar_tipo">
                <option value="">Todos los Tipos</option>
            </select>
            <select id="buscar_estado">
                <option value="">Todos los Estados</option>
            </select>
            <div class="input-with-icon">
                <span class="input-icon">📅</span>
                <input id="buscar_duracion" type="text" placeholder="Duración (ej. 12 meses)" />
            </div>
            <button id="btn_buscar_garantia" type="button">Buscar</button>
        </div>
    </section>

    <section class="tabla" id="seccion-tabla">
        <h2>Lista de Garantías</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Fecha Registro</th>
                    <th>Vence</th>
                    <th>Tipo</th>
                    <th>Estado</th>
                    <th>Duración</th>
                    <th>Condición</th>
                    <th id="th-acciones-garantia" style="text-align:center;">Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaGarantias">
            </tbody>
        </table>
    </section>

</div>
