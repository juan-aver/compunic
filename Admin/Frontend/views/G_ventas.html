<!-- 
  ========================================== 
  Vista estructurada con paciencia. 
  Ojo con borrar las clases, el CSS depende de esto como mi vida del café.
  ========================================== 
-->
<link rel="stylesheet" href="css/views/G_ventas.css">
<!-- Dark Mode & Enhanced Animations -->
<link rel="stylesheet" href="css/views/dark-mode.css">
<link rel="stylesheet" href="css/views/enhanced-animations.css">
<!-- Table Enhancements -->
<link rel="stylesheet" href="css/views/table-enhancements.css">
<script src="js/table-enhancements.js" defer></script>
<script src="js/search/ventas-table-init.js" defer></script>

<div class="container-fluid">
  <div class="row">
    <div class="col-md-12">
      <!-- Header -->
    </div>
  </div>

  <div class="container full-width-container">
    <!-- POS-STYLE 2-COLUMN LAYOUT -->
    <section class="formulario form-section" id="seccion-formulario-venta">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 12px; flex-wrap:wrap; gap:10px;">
        <h2 style="margin:0;">Gestión de Ventas</h2>
        <button type="button" onclick="abrirModalCotizaciones()" class="btn-cancel" style="background:#0284c7; color:white; border:none; padding:8px 16px; border-radius:6px; font-weight:600; cursor:pointer;">
          <i class="fas fa-file-invoice"></i> Historial Proformas / Cotizaciones
        </button>
      </div>

      <!-- Compact header row: Cliente, Vendedor, Factura, Fecha -->
      <div class="ventas-pos-header">
        <div class="pos-header-field">
          <label class="form-label-small">Cliente</label>
          <select id="cliente-select" class="form-select" onchange="toggleClienteOcasional(this.value)">
            <option value="" disabled selected>Seleccione un Cliente</option>
            <option value="__ocasional__">👤 Cliente Ocasional / Sin Registro</option>
          </select>
        </div>
        <!-- Campo de nombre para cliente ocasional (oculto por defecto) -->
        <div class="pos-header-field" id="cliente-ocasional-wrapper" style="display:none;">
          <label class="form-label-small">Nombre para Factura</label>
          <input type="text" id="cliente-ocasional-nombre" class="form-input" placeholder="Nombre del cliente...">
        </div>
        <div class="pos-header-field">
          <label class="form-label-small">Vendedor</label>
          <input type="text" id="vendedor-display" class="form-input" readonly placeholder="Cargando...">
          <input type="hidden" id="vendedor-id">
        </div>
        <div class="pos-header-field">
          <label class="form-label-small">No. Factura</label>
          <input type="text" id="factura-input" class="form-input" placeholder="Autogenerado" readonly>
        </div>
        <div class="pos-header-field">
          <label class="form-label-small">Fecha</label>
          <input type="text" id="fecha-venta-display" class="form-input" readonly placeholder="Cargando...">
          <input type="hidden" id="fecha-venta">
        </div>
      </div>

      <form id="sale-form">
        <div class="ventas-pos-container">

          <!-- LEFT: Product List -->
          <div class="ventas-product-list">
            <div class="ventas-pos-search-wrapper">
              <i class="fas fa-search"></i>
              <input type="text" id="ventas-pos-search" placeholder="Buscar producto por nombre..." class="form-input">
            </div>
            <div id="ventas-products-grid" class="ventas-pos-products-grid">
              <!-- Product cards rendered by JS -->
              <div class="cart-empty-message">
                <i class="fas fa-boxes"></i>
                <p>Cargando productos...</p>
              </div>
            </div>
          </div>

          <!-- RIGHT: Cart Panel -->
          <div class="ventas-cart-section">
            <div class="ventas-cart-header">
              <i class="fas fa-shopping-cart"></i> Detalle de la Venta
              <span id="ventas-cart-badge" class="ventas-cart-badge" style="display:none">0</span>
            </div>

            <!-- Carrito de Items (Cards) -->
            <div id="cart-table-body" class="cart-items-container">
              <div class="cart-empty-message">
                <i class="fas fa-shopping-cart"></i>
                <p>Haz clic en un producto para agregarlo.</p>
              </div>
            </div>

            <!-- Totales -->
            <div class="cart-total-section">
              <div class="cart-total-row">
                <span>Subtotal</span>
                <span id="subtotal-venta-display">C$0.00</span>
              </div>
              <div class="cart-total-row">
                <span>IVA (15%)</span>
                <span id="iva-venta-display">C$0.00</span>
              </div>
              <div class="cart-total-row total-final">
                <span>TOTAL VENTA</span>
                <span id="total-venta-display">C$0.00</span>
              </div>
            </div>

            <!-- Botones de Acción -->
            <div class="ventas-cart-actions" style="display: flex; gap: 8px; flex-wrap: wrap;">
              <button type="button" onclick="cancelarVenta()" class="btn-cancel" style="flex: 1;">
                Cancelar
              </button>
              <button type="button" onclick="guardarCotizacion()" id="btn-save-quote" class="btn-cancel" style="background: #0284c7; color: white; border: none; font-weight: 600; flex: 1.2;" title="Emitir proforma comercial con vigencia temporal (no descuenta stock)">
                <i class="fas fa-file-invoice"></i> Cotizar / Proforma
              </button>
              <button type="button" onclick="guardarVenta()" id="btn-save-sale" class="btn-register" style="flex: 1.4;">
                <i class="fas fa-save"></i> Guardar Venta
              </button>
            </div>
          </div>

        </div>
      </form>
    </section>

    <!-- Modal Historial de Cotizaciones / Proformas (REQ-FR-19, UR-08) -->
    <div id="modal-cotizaciones-historial" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:99999; justify-content:center; align-items:center;">
      <div style="background:var(--bg-card, #ffffff); border-radius:12px; width:950px; max-width:95%; max-height:85vh; display:flex; flex-direction:column; overflow:hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.3); border:1px solid var(--border-color, #e2e8f0);">
        <div style="padding:15px 20px; background:#0284c7; color:white; display:flex; justify-content:space-between; align-items:center;">
          <h3 style="margin:0; font-size:18px; color:white;"><i class="fas fa-file-invoice"></i> Cotizaciones y Proformas Comerciales</h3>
          <button onclick="cerrarModalCotizaciones()" style="background:transparent; border:none; color:white; font-size:22px; cursor:pointer;">&times;</button>
        </div>
        <div style="padding:15px 20px; overflow-y:auto; flex:1;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; gap:10px;">
            <input type="text" id="buscar_cotizacion" oninput="filtrarCotizaciones(this.value)" placeholder="Buscar por N° cotización, cliente o estado..." style="flex:1; padding:8px 12px; border:1px solid var(--border-color, #ccc); border-radius:6px; background:var(--bg-input, #fff); color:var(--text-color, #333);">
          </div>
          <div style="overflow-x:auto;">
            <table class="table-main" style="width:100%; font-size:13px;">
              <thead>
                <tr style="background:var(--bg-card-alt, #f1f5f9); color:var(--text-color, #333);">
                  <th style="padding:10px;">N° Proforma</th>
                  <th style="padding:10px;">Cliente</th>
                  <th style="padding:10px;">Emisión</th>
                  <th style="padding:10px;">Vence</th>
                  <th style="padding:10px; text-align:right;">Total C$</th>
                  <th style="padding:10px; text-align:center;">Estado</th>
                  <th style="padding:10px; text-align:center;">Acciones</th>
                </tr>
              </thead>
              <tbody id="cotizaciones-record-table">
                <tr><td colspan="7" style="text-align:center; padding:20px;">Cargando proformas...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
        <div style="padding:12px 20px; background:var(--bg-card-alt, #f8fafc); border-top:1px solid var(--border-color, #e2e8f0); text-align:right;">
          <button onclick="cerrarModalCotizaciones()" class="btn-cancel" style="padding:8px 16px;">Cerrar</button>
        </div>
      </div>
    </div>

  </div>
</div>
