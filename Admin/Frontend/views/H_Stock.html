<!-- html de movimientos_stock -->
<!DOCTYPE html>
<html lang="es">

<!-- 
  ========================================== 
  Plantilla principal. 
  Nota mental: Revisar accesibilidad (algún día). 
  ========================================== 
-->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de Categorías</title>
  <link rel="stylesheet" href="css/views/H_Stock.css">
</head>

<body>
  <div class="main-container">
    <header>
      <h1>Historial de Stock</h1>
    </header>

    <div class="content-wrapper">
      <div class="table-container catalogo-section">
        <h3><i class="fas fa-history"></i> Registro de Movimientos de Inventario</h3>
        <p>Bitácora completa de entradas, salidas y ajustes de stock.</p>

        <!-- Controles de Tabla -->
        <div class="table-controls" style="margin-bottom: 20px;">
            <div class="search-enhanced-container" style="width: 100%;">
                <div class="search-input-wrapper" style="display: flex; gap: 15px; align-items: center; width: 100%;">
                    <input type="text" id="buscar_stock" class="filter-search"
                        placeholder="Buscar por producto o motivo..." style="flex: 1; padding: 10px 15px; border-radius: 8px; border: 1px solid #ccc;">
                    <button class="btn-clear-filters" onclick="clearStockFilters()" style="white-space: nowrap; padding: 10px 15px; border-radius: 8px; cursor: pointer;">
                        <i class="fas fa-times"></i> Limpiar
                    </button>
                </div>
            </div>
        </div>

        <table id="tabla-historial">
          <thead>
            <tr>
              <th>ID</th>
              <th>Producto</th>
              <th>Tipo</th>
              <th>Motivo</th>
              <th>Cantidad</th>
              <th>Stock Resultante</th>
              <th>Fecha</th>
            </tr>
          </thead>
          <tbody>
            <!-- Se llena dinámicamente -->
          </tbody>
        </table>
        
        <!-- Pagination Controls -->
        <div id="stock-pagination-container" class="pagination-controls" style="margin-top: 20px; display: flex; justify-content: center; gap: 10px; align-items: center;"></div>
      </div>
    </div>
  </div>
  <script src="../script.js"></script>
</body>

</html>
