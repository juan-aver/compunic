[build]
  command = "rm -rf dist && mkdir -p dist/Store && cp -r Admin/Frontend/. dist/ && cp -r Store/. dist/Store/"
  publish = "dist"

[[redirects]]
  from = "/store"
  to = "/Store/views/index.html"
  status = 301

[[redirects]]
  from = "/tienda"
  to = "/Store/views/index.html"
  status = 301

[[redirects]]
  from = "/api/*"
  to = "https://compunic-production.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://compunic-production.up.railway.app/uploads/:splat"
  status = 200
  force = true

