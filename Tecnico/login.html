<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Acceso Técnico | Compunic</title>
  <link rel="icon" type="image/png" href="../Admin/Frontend/assets/logo.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#060c18">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Compunic Técnico">
  
  <!-- Fuentes e Iconos (Idénticos al sistema principal) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #060c18;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px 16px;
      position: relative;
      overflow-x: hidden;
      user-select: none;
    }

    /* Orbes de fondo (Paleta exacta Compunic: #145D90 y #56A5DD) */
    .bg-orbs {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      animation: orbFloat 18s ease-in-out infinite alternate;
    }

    .orb-1 {
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, #145D90, transparent 70%);
      top: -60px;
      left: -80px;
    }

    .orb-2 {
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, #56A5DD, transparent 70%);
      bottom: -60px;
      right: -60px;
      animation-delay: -6s;
    }

    @keyframes orbFloat {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(25px, 35px) scale(1.08); }
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 2;
    }

    /* Tarjeta Idéntica al Sistema Principal, adaptada a Smartphone */
    .login-card {
      width: 100%;
      background: rgba(12, 22, 42, 0.88);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 24px;
      padding: 2.2rem 1.6rem;
      border: 1px solid rgba(86, 165, 221, 0.18);
      box-shadow:
        0 0 40px rgba(86, 165, 221, 0.08),
        0 25px 50px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      animation: fadeSlideUp 0.6s ease-out both;
    }

    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Cabecera / Icono */
    .login-header {
      text-align: center;
      margin-bottom: 1.8rem;
    }

    .login-header .login-icon {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background: linear-gradient(135deg, #145D90, #56A5DD);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
      font-size: 1.6rem;
      color: white;
      box-shadow: 0 8px 25px rgba(20, 93, 144, 0.45);
    }

    .badge-subapp {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(86, 165, 221, 0.12);
      border: 1px solid rgba(86, 165, 221, 0.3);
      color: #56A5DD;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 8px;
    }

    .login-header h2 {
      font-size: 1.55rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 0.35rem;
    }

    .login-header p {
      color: rgba(255, 255, 255, 0.45);
      font-size: 0.88rem;
    }

    /* Form groups & Labels */
    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: rgba(255, 255, 255, 0.7);
      font-weight: 500;
      font-size: 0.85rem;
      letter-spacing: 0.3px;
    }

    /* Inputs idénticos al sistema con solución completa al Autocomplete Blanco */
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .input-wrapper .input-icon {
      position: absolute;
      left: 14px;
      color: rgba(86, 165, 221, 0.6);
      font-size: 1rem;
      pointer-events: none;
      transition: color 0.3s;
      z-index: 2;
    }

    .input-wrapper input {
      width: 100%;
      padding: 0.95rem 2.8rem 0.95rem 2.75rem;
      background: rgba(255, 255, 255, 0.05) !important;
      border: 1px solid rgba(86, 165, 221, 0.2);
      border-radius: 12px;
      font-size: 0.98rem;
      font-family: inherit;
      color: #ffffff !important;
      transition: all 0.3s ease;
      outline: none;
      -webkit-text-fill-color: #ffffff !important;
    }

    /* Solución definitiva para que Chrome/Android no pinte el fondo blanco al autocompletar */
    .input-wrapper input:-webkit-autofill,
    .input-wrapper input:-webkit-autofill:hover, 
    .input-wrapper input:-webkit-autofill:focus, 
    .input-wrapper input:-webkit-autofill:active {
      -webkit-box-shadow: 0 0 0 1000px #0e1c36 inset !important;
      box-shadow: 0 0 0 1000px #0e1c36 inset !important;
      -webkit-text-fill-color: #ffffff !important;
      border-color: rgba(86, 165, 221, 0.4) !important;
      caret-color: #ffffff;
    }

    .input-wrapper input::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    .input-wrapper input:focus {
      border-color: #56A5DD;
      background: rgba(86, 165, 221, 0.1) !important;
      box-shadow: 0 0 0 3px rgba(86, 165, 221, 0.15), 0 0 20px rgba(86, 165, 221, 0.1);
    }

    .input-wrapper input:focus ~ .input-icon {
      color: #56A5DD;
    }

    /* Botón Mostrar/Ocultar Contraseña */
    .toggle-password {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.4);
      cursor: pointer;
      font-size: 1.05rem;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      transition: color 0.2s;
    }

    .toggle-password:hover {
      color: #56A5DD;
    }

    /* Mensaje de Error */
    .error-msg {
      color: #ff6b6b;
      background: rgba(255, 107, 107, 0.12);
      border: 1px solid rgba(255, 107, 107, 0.25);
      padding: 0.75rem 1rem;
      border-radius: 12px;
      margin-bottom: 1.25rem;
      display: none;
      font-size: 0.86rem;
      font-weight: 500;
      text-align: center;
      align-items: center;
      justify-content: center;
      gap: 8px;
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    /* Botón de Inicio de Sesión (Estilo exacto Compunic) */
    .btn-login {
      width: 100%;
      padding: 0.95rem;
      background: linear-gradient(135deg, #145D90, #56A5DD);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 20px rgba(20, 93, 144, 0.4);
    }

    .btn-login:active {
      transform: scale(0.98);
    }

    .btn-login:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    /* Enlace de Olvido de Contraseña */
    .forgot-link {
      display: block;
      text-align: center;
      margin-top: 1.25rem;
      color: rgba(86, 165, 221, 0.85);
      font-size: 0.88rem;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }

    .forgot-link:hover {
      color: #56A5DD;
      text-decoration: underline;
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 1.25rem 0;
      color: rgba(255, 255, 255, 0.2);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
    }

    /* Botón Volver al Sistema */
    .btn-guest {
      width: 100%;
      padding: 0.85rem;
      background: rgba(255, 255, 255, 0.05);
      color: rgba(255, 255, 255, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
    }

    .btn-guest:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    /* Banner PWA */
    .install-pwa-banner {
      margin-top: 20px;
      background: rgba(86, 165, 221, 0.1);
      border: 1px solid rgba(86, 165, 221, 0.25);
      border-radius: 14px;
      padding: 12px 16px;
      display: none;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .install-pwa-banner span {
      font-size: 0.82rem;
      color: #bae6fd;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-install {
      background: #56A5DD;
      color: #060c18;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Luces / Orbes de Fondo -->
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-icon">
          <i class="fas fa-screwdriver-wrench"></i>
        </div>
        <div class="badge-subapp">
          <i class="fas fa-mobile-screen"></i> Compunic Técnico
        </div>
        <h2>Portal Técnico</h2>
        <p>Ingresa con tu usuario de servicio técnico</p>
      </div>

      <div class="error-msg" id="errorMsg">
        <i class="fas fa-circle-exclamation"></i>
        <span id="errorText">Credenciales incorrectas</span>
      </div>

      <form id="form-login-tecnico" onsubmit="iniciarSesion(event)">
        <div class="form-group">
          <label for="username">Usuario o Empleado</label>
          <div class="input-wrapper">
            <input type="text" id="username" placeholder="Tu usuario asignado" required autocomplete="username" autocapitalize="none">
            <i class="fas fa-user input-icon"></i>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="input-wrapper">
            <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
            <i class="fas fa-lock input-icon"></i>
            <button type="button" class="toggle-password" id="togglePassword" onclick="togglePass()" title="Mostrar/ocultar contraseña">
              <i class="fas fa-eye" id="pass-icon"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-login" id="btnLogin">
          <span id="btn-text">Ingresar a mis órdenes</span>
          <i class="fas fa-arrow-right"></i>
        </button>

        <a href="/forgot-password.html" class="forgot-link">¿Olvidaste tu contraseña?</a>

        <div class="divider"><span>o</span></div>

        <a href="/index.html" class="btn-guest">
          <i class="fas fa-arrow-left"></i>
          Volver al Sistema Principal
        </a>
      </form>
    </div>

    <!-- Banner para instalar app en smartphone -->
    <div class="install-pwa-banner" id="pwa-banner">
      <span><i class="fas fa-mobile-screen-button"></i> Instalar app en teléfono</span>
      <button class="btn-install" id="btn-install-app">Instalar</button>
    </div>
  </div>

  <script>
    const AUTH_KEY = 'compunic_session';
    const isLocal = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') && window.location.port !== '';
    const API_BASE = isLocal ? 'http://localhost:3001/api' : '/api';

    // Verificar si ya tiene sesión activa
    document.addEventListener('DOMContentLoaded', () => {
      const session = sessionStorage.getItem(AUTH_KEY);
      if (session) {
        window.location.href = 'index.html';
      }
    });

    function togglePass() {
      const input = document.getElementById('password');
      const icon = document.getElementById('pass-icon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fas fa-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'fas fa-eye';
      }
    }

    async function iniciarSesion(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('btnLogin');
      const btnText = document.getElementById('btn-text');
      const errorMsg = document.getElementById('errorMsg');
      const errorText = document.getElementById('errorText');

      errorMsg.style.display = 'none';
      btn.disabled = true;
      btnText.textContent = 'Verificando...';

      try {
        const res = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (!res.ok || !data.success) {
          throw new Error(data.message || 'Credenciales incorrectas');
        }

        // Guardar sesión
        const session = {
          user: data.user.username,
          nombre: data.user.nombre,
          apellido: data.user.apellido,
          rol: data.user.rol.toLowerCase(),
          id_empleado: data.user.id_empleado,
          email: data.user.email,
          timestamp: new Date().getTime()
        };

        sessionStorage.setItem(AUTH_KEY, JSON.stringify(session));

        // Enviar directo al portal de tareas
        window.location.href = 'index.html';

      } catch (err) {
        errorText.textContent = err.message;
        errorMsg.style.display = 'flex';
        btn.disabled = false;
        btnText.textContent = 'Ingresar a mis órdenes';
      }
    }

    // Soporte PWA (Instalar en la pantalla de inicio del teléfono)
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const banner = document.getElementById('pwa-banner');
      if (banner) banner.style.display = 'flex';
    });

    document.getElementById('btn-install-app')?.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        document.getElementById('pwa-banner').style.display = 'none';
      }
      deferredPrompt = null;
    });
  </script>
</body>
</html>
