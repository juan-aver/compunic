<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Acceso Técnico | Compunic</title>
  <link rel="icon" type="image/png" href="../Admin/Frontend/assets/logo.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0f1d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Compunic Técnico">
  
  <!-- Fuentes e Iconos -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    :root {
      --primary: #3b82f6;
      --primary-dark: #1d4ed8;
      --accent: #06b6d4;
      --bg: #0a0f1d;
      --card-bg: rgba(22, 30, 49, 0.75);
      --card-border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: rgba(13, 20, 36, 0.7);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px 20px;
      position: relative;
      overflow-x: hidden;
      user-select: none;
    }

    /* Luces de fondo dinámicas (Glow Effect) */
    .glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.45;
      animation: floatOrb 12s ease-in-out infinite alternate;
    }

    .glow-orb-1 {
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, #2563eb, transparent 70%);
      top: -60px;
      left: -80px;
    }

    .glow-orb-2 {
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, #06b6d4, transparent 70%);
      bottom: -60px;
      right: -60px;
      animation-delay: -5s;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(25px, 30px) scale(1.1); }
    }

    .login-container {
      width: 100%;
      max-width: 410px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    /* Cabecera / Identidad */
    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 26px;
    }

    .brand-icon-box {
      width: 76px;
      height: 76px;
      border-radius: 24px;
      background: linear-gradient(135deg, #2563eb, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.1rem;
      color: #ffffff;
      box-shadow: 0 12px 35px rgba(37, 99, 235, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.4);
      margin-bottom: 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .badge-portal {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(6, 182, 212, 0.12);
      border: 1px solid rgba(6, 182, 212, 0.3);
      color: #38bdf8;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 8px;
    }

    .brand-header h1 {
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      color: #ffffff;
      line-height: 1.2;
    }

    .brand-header p {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-top: 5px;
    }

    /* Tarjeta Glassmorphic */
    .login-card {
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 28px 24px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.08);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
    }

    .form-label {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #cbd5e1;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      background: var(--input-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 0 14px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .input-wrapper:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
      background: rgba(15, 23, 42, 0.9);
    }

    .input-wrapper i.input-icon {
      color: var(--text-muted);
      font-size: 1.05rem;
      margin-right: 12px;
    }

    .input-wrapper input {
      width: 100%;
      padding: 15px 0;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-family: inherit;
      font-size: 0.98rem;
      font-weight: 500;
    }

    .input-wrapper input::placeholder {
      color: #64748b;
      font-weight: 400;
    }

    .btn-toggle-pass {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.05rem;
      padding: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s ease;
    }

    .btn-toggle-pass:hover {
      color: #ffffff;
    }

    /* Alerta de error animada */
    .alert-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 20px;
      display: none;
      align-items: center;
      gap: 10px;
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    /* Botón Principal */
    .btn-submit {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border: none;
      border-radius: 14px;
      color: #ffffff;
      font-family: inherit;
      font-size: 1.02rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.45);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-submit:active {
      transform: scale(0.975);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .btn-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    /* Enlace de recuperación de contraseña */
    .forgot-wrapper {
      text-align: center;
      margin-top: 18px;
    }

    .forgot-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #60a5fa;
      font-size: 0.86rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      padding: 4px 8px;
      border-radius: 8px;
    }

    .forgot-link:hover {
      color: #93c5fd;
      background: rgba(59, 130, 246, 0.1);
    }

    /* Separador y enlace de vuelta */
    .divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
      margin: 22px 0 16px;
    }

    .btn-back-system {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 11px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      color: #94a3b8;
      font-size: 0.84rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-back-system:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }

    /* Banner para instalar app en celular */
    .install-pwa-banner {
      margin-top: 22px;
      background: rgba(6, 182, 212, 0.1);
      border: 1px solid rgba(6, 182, 212, 0.3);
      border-radius: 14px;
      padding: 12px 16px;
      display: none;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .install-pwa-banner span {
      font-size: 0.82rem;
      color: #bae6fd;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-install {
      background: #06b6d4;
      color: #0f172a;
      border: none;
      padding: 7px 14px;
      border-radius: 10px;
      font-size: 0.78rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .btn-install:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <!-- Luces de fondo -->
  <div class="glow-orb glow-orb-1"></div>
  <div class="glow-orb glow-orb-2"></div>

  <div class="login-container">
    <div class="brand-header">
      <div class="brand-icon-box">
        <i class="fas fa-screwdriver-wrench"></i>
      </div>
      <div class="badge-portal">
        <i class="fas fa-circle-dot" style="font-size: 0.55rem; color: #10b981;"></i> Compunic Soporte
      </div>
      <h1>Portal Técnico</h1>
      <p>Gestión móvil de tareas y reparaciones</p>
    </div>

    <div class="login-card">
      <div class="alert-error" id="error-alert">
        <i class="fas fa-circle-exclamation"></i>
        <span id="error-text">Credenciales incorrectas</span>
      </div>

      <form id="form-login-tecnico" onsubmit="iniciarSesion(event)">
        <div class="form-group">
          <label class="form-label" for="username">Usuario o Empleado</label>
          <div class="input-wrapper">
            <i class="fas fa-user-gear input-icon"></i>
            <input type="text" id="username" placeholder="Tu usuario asignado" required autocomplete="username" autocapitalize="none">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <div class="input-wrapper">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" class="btn-toggle-pass" onclick="togglePass()" aria-label="Mostrar contraseña">
              <i class="fas fa-eye" id="pass-icon"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-submit" id="btn-submit">
          <span>Ingresar a mis órdenes</span>
          <i class="fas fa-arrow-right"></i>
        </button>

        <!-- Botón ¿Olvidaste tu contraseña? -->
        <div class="forgot-wrapper">
          <a href="/forgot-password.html" class="forgot-link">
            <i class="fas fa-key"></i> ¿Olvidaste tu contraseña?
          </a>
        </div>

        <div class="divider"></div>

        <a href="/index.html" class="btn-back-system">
          <i class="fas fa-arrow-left"></i> Volver al Sistema Principal
        </a>
      </form>
    </div>

    <!-- Banner para instalar app en smartphone -->
    <div class="install-pwa-banner" id="pwa-banner">
      <span><i class="fas fa-mobile-screen-button"></i> Instalar app en teléfono</span>
      <button class="btn-install" id="btn-install-app">Instalar</button>
    </div>
  </div>

  <script>
    const AUTH_KEY = 'compunic_session';
    const isLocal = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') && window.location.port !== '';
    const API_BASE = isLocal ? 'http://localhost:3001/api' : '/api';

    // Verificar si ya tiene sesión activa
    document.addEventListener('DOMContentLoaded', () => {
      const session = sessionStorage.getItem(AUTH_KEY);
      if (session) {
        window.location.href = 'index.html';
      }
    });

    function togglePass() {
      const input = document.getElementById('password');
      const icon = document.getElementById('pass-icon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fas fa-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'fas fa-eye';
      }
    }

    async function iniciarSesion(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('btn-submit');
      const errorAlert = document.getElementById('error-alert');
      const errorText = document.getElementById('error-text');

      errorAlert.style.display = 'none';
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verificando...';

      try {
        const res = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (!res.ok || !data.success) {
          throw new Error(data.message || 'Credenciales incorrectas');
        }

        // Guardar sesión
        const session = {
          user: data.user.username,
          nombre: data.user.nombre,
          apellido: data.user.apellido,
          rol: data.user.rol.toLowerCase(),
          id_empleado: data.user.id_empleado,
          email: data.user.email,
          timestamp: new Date().getTime()
        };

        sessionStorage.setItem(AUTH_KEY, JSON.stringify(session));

        // Enviar directo al portal de tareas
        window.location.href = 'index.html';

      } catch (err) {
        errorText.textContent = err.message;
        errorAlert.style.display = 'flex';
        btn.disabled = false;
        btn.innerHTML = '<span>Ingresar a mis órdenes</span> <i class="fas fa-arrow-right"></i>';
      }
    }

    // Soporte PWA (Instalar en la pantalla de inicio del teléfono)
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const banner = document.getElementById('pwa-banner');
      if (banner) banner.style.display = 'flex';
    });

    document.getElementById('btn-install-app')?.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        document.getElementById('pwa-banner').style.display = 'none';
      }
      deferredPrompt = null;
    });
  </script>
</body>
</html>
