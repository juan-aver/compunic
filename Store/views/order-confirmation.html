<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Confirmación de pedido — sube tu comprobante de pago para que verificamos tu pedido en COMPUNIC.">
    <title>Confirmación de Pedido — COMPUNIC</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../public/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { font-family: 'Inter', sans-serif; box-sizing: border-box; }
        body { background: #f1f5f9; min-height: 100vh; margin: 0; }

        .conf-hero {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: white;
            padding: 60px 20px 80px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .conf-hero::before {
            content: '';
            position: absolute; inset: 0;
            background: radial-gradient(circle at 30% 50%, rgba(99,102,241,0.2) 0%, transparent 60%),
                        radial-gradient(circle at 70% 30%, rgba(139,92,246,0.15) 0%, transparent 50%);
        }
        .conf-hero .inner { position: relative; z-index: 1; max-width: 600px; margin: 0 auto; }
        .conf-hero .order-icon {
            width: 80px; height: 80px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem;
            margin: 0 auto 20px;
            border: 2px solid rgba(255,255,255,0.2);
        }
        .conf-hero h1 { font-size: 1.8rem; font-weight: 800; margin: 0 0 8px; }
        .conf-hero p  { opacity: 0.8; font-size: 1rem; margin: 0; }
        .order-badge {
            display: inline-block;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-top: 14px;
            letter-spacing: 0.5px;
        }

        /* TIMELINE DE ESTADO */
        .status-timeline {
            max-width: 700px;
            margin: -30px auto 0;
            padding: 0 16px;
            position: relative;
            z-index: 10;
        }
        .timeline-card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        .timeline-steps {
            display: flex;
            align-items: center;
            gap: 0;
        }
        .ts-step {
            flex: 1;
            text-align: center;
            position: relative;
        }
        .ts-step .ts-dot {
            width: 36px; height: 36px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 8px;
            font-size: 0.9rem;
            font-weight: 700;
            border: 3px solid #e2e8f0;
            background: white;
            color: #94a3b8;
            transition: all 0.4s;
        }
        .ts-step.done .ts-dot    { background: #22c55e; border-color: #22c55e; color: white; }
        .ts-step.active .ts-dot  { background: #f97316; border-color: #f97316; color: white; animation: pulse 2s infinite; }
        .ts-step.pending .ts-dot { background: #f8fafc; border-color: #e2e8f0; color: #94a3b8; }
        @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(249,115,22,0.4); } 50% { box-shadow: 0 0 0 8px rgba(249,115,22,0); } }
        .ts-label { font-size: 0.7rem; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
        .ts-step.done .ts-label   { color: #22c55e; }
        .ts-step.active .ts-label { color: #f97316; }
        .ts-line {
            flex: 0 0 32px;
            height: 3px;
            background: #e2e8f0;
            margin-bottom: 20px;
            transition: background 0.4s;
        }
        .ts-line.done { background: #22c55e; }

        /* STATUS BADGE */
        .status-badge {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 8px 18px; border-radius: 20px;
            font-size: 0.85rem; font-weight: 700;
            margin-top: 16px;
        }
        .status-badge.pendiente  { background: #fff7ed; color: #c2410c; border: 1px solid #fed7aa; }
        .status-badge.verificando { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
        .status-badge.confirmado { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
        .status-badge.rechazado  { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }

        /* MAIN CONTENT */
        .conf-content {
            max-width: 700px;
            margin: 24px auto;
            padding: 0 16px;
            display: grid;
            gap: 20px;
        }

        .conf-card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .conf-card h3 {
            display: flex; align-items: center; gap: 10px;
            font-size: 1rem; font-weight: 700; color: #0f172a;
            margin: 0 0 18px;
        }

        /* UPLOAD AREA */
        .upload-zone {
            border: 2px dashed #c7d2fe;
            border-radius: 12px;
            padding: 32px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s;
            background: #f8f8ff;
            position: relative;
        }
        .upload-zone:hover, .upload-zone.dragging {
            border-color: #6366f1;
            background: #ede9fe;
        }
        .upload-zone.has-file {
            border-color: #22c55e;
            background: #f0fdf4;
        }
        .upload-zone input[type="file"] {
            position: absolute; inset: 0;
            opacity: 0; cursor: pointer; width: 100%; height: 100%;
        }
        .upload-icon { font-size: 2.5rem; color: #6366f1; margin-bottom: 12px; }
        .upload-zone.has-file .upload-icon { color: #22c55e; }
        .upload-title { font-weight: 700; color: #0f172a; font-size: 0.95rem; }
        .upload-sub   { font-size: 0.8rem; color: #64748b; margin-top: 4px; }
        .upload-preview {
            margin-top: 14px;
            display: none;
        }
        .upload-preview.visible { display: block; }
        .preview-img {
            max-width: 200px; max-height: 160px;
            border-radius: 8px;
            border: 2px solid #22c55e;
            object-fit: cover;
        }
        .file-name {
            font-size: 0.8rem; color: #166534; font-weight: 600;
            margin-top: 6px;
        }

        .notes-field {
            width: 100%;
            margin-top: 12px;
            padding: 10px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 0.85rem;
            resize: vertical;
            font-family: 'Inter', sans-serif;
        }
        .notes-field:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.1); }

        .upload-btn {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            width: 100%; padding: 12px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white; font-weight: 700; font-size: 0.95rem;
            border: none; border-radius: 10px; cursor: pointer;
            margin-top: 14px; transition: all 0.25s;
        }
        .upload-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(99,102,241,0.35); }
        .upload-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        /* PAYMENT INFO BOX */
        .pay-info-box {
            background: linear-gradient(135deg, #f0f9ff 0%, #eff6ff 100%);
            border: 1px solid #bfdbfe;
            border-radius: 12px;
            padding: 20px;
        }
        .pay-info-box .bank-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 9px 0;
            border-bottom: 1px dashed #e2e8f0;
            font-size: 0.875rem;
        }
        .pay-info-box .bank-row:last-child { border-bottom: none; }
        .pay-info-box .label { color: #64748b; }
        .pay-info-box .value { font-weight: 700; color: #0f172a; }
        .pay-info-box .value.account {
            font-family: monospace; color: #3b82f6; font-size: 1rem; letter-spacing: 1px;
        }
        .copy-btn {
            background: #ede9fe; border: none; color: #6366f1;
            padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 0.75rem;
            font-weight: 600; transition: background 0.2s;
        }
        .copy-btn:hover { background: #ddd6fe; }
        .total-display {
            text-align: center;
            margin-top: 14px;
            padding: 14px;
            background: #eff6ff;
            border-radius: 10px;
            font-size: 1.3rem;
            font-weight: 800;
            color: #1d4ed8;
        }

        /* REJECTED STATE */
        .rejected-card {
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 12px;
            padding: 20px;
        }
        .rejected-card h4 { color: #991b1b; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
        .rejected-card p  { color: #7f1d1d; font-size: 0.9rem; margin: 0; }
        .motivo-box {
            background: white;
            border: 1px solid #fca5a5;
            border-radius: 8px;
            padding: 12px;
            font-style: italic;
            color: #991b1b;
            margin: 10px 0;
        }

        /* SUCCESS STATE */
        .success-card {
            background: linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 100%);
            border: 1px solid #bbf7d0;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
        }
        .success-card i { font-size: 3rem; color: #22c55e; }
        .success-card h3 { color: #166534; margin: 12px 0 6px; }
        .success-card p  { color: #4d7c0f; font-size: 0.9rem; }

        /* ACTIONS */
        .conf-actions {
            display: flex; gap: 12px; flex-wrap: wrap;
        }
        .btn-outline-conf {
            display: flex; align-items: center; gap: 8px;
            padding: 10px 20px;
            background: white;
            border: 2px solid #6366f1;
            color: #6366f1;
            font-weight: 700; font-size: 0.875rem;
            border-radius: 10px; text-decoration: none;
            transition: all 0.2s;
        }
        .btn-outline-conf:hover { background: #6366f1; color: white; }
        .btn-primary-conf {
            display: flex; align-items: center; gap: 8px;
            padding: 10px 20px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white; font-weight: 700; font-size: 0.875rem;
            border-radius: 10px; text-decoration: none;
            transition: all 0.2s; border: none; cursor: pointer;
        }
        .btn-primary-conf:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(99,102,241,0.35); }

        .navbar { background: #1a1a2e; }
        .navbar-brand, .navbar-brand span { color: white !important; }
    </style>
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="container navbar-content">
            <a href="index.html" class="navbar-brand">
                <div class="navbar-brand-icon"><i class="fas fa-bolt"></i></div>
                <span>COMPUNIC</span>
            </a>
        </div>
    </nav>

    <!-- HERO -->
    <div class="conf-hero" id="heroSection">
        <div class="inner">
            <div class="order-icon" id="heroIcon"><i class="fas fa-receipt"></i></div>
            <h1 id="heroTitle">¡Pedido Recibido!</h1>
            <p id="heroSubtitle">Ya casi terminas — realiza el pago para confirmar tu pedido</p>
            <div class="order-badge" id="orderBadge">Cargando...</div>
        </div>
    </div>

    <!-- TIMELINE -->
    <div class="status-timeline">
        <div class="timeline-card">
            <div class="timeline-steps" id="timelineSteps">
                <div class="ts-step done" id="ts1">
                    <div class="ts-dot"><i class="fas fa-check"></i></div>
                    <div class="ts-label">Pedido</div>
                </div>
                <div class="ts-line" id="tl1"></div>
                <div class="ts-step active" id="ts2">
                    <div class="ts-dot"><i class="fas fa-clock"></i></div>
                    <div class="ts-label">Pago</div>
                </div>
                <div class="ts-line" id="tl2"></div>
                <div class="ts-step pending" id="ts3">
                    <div class="ts-dot"><i class="fas fa-search"></i></div>
                    <div class="ts-label">Verificación</div>
                </div>
                <div class="ts-line" id="tl3"></div>
                <div class="ts-step pending" id="ts4">
                    <div class="ts-dot"><i class="fas fa-box"></i></div>
                    <div class="ts-label">Confirmado</div>
                </div>
            </div>

            <div style="text-align:center; margin-top:8px;">
                <span class="status-badge pendiente" id="statusBadge">
                    <i class="fas fa-clock"></i> <span id="statusText">Pendiente de pago</span>
                </span>
            </div>
        </div>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="conf-content" id="mainContent">
        <!-- Este contenido se renderiza dinámicamente según el estado -->
        <div style="text-align:center; padding:40px; color:#94a3b8;">
            <i class="fas fa-spinner fa-spin fa-2x"></i>
            <p style="margin-top:12px;">Cargando información del pedido...</p>
        </div>
    </div>

    <script src="../public/js/api.js"></script>
    <script src="../public/js/store-auth.js"></script>
    <script>
    /* ================================================
       COMPUNIC — ORDER CONFIRMATION + COMPROBANTE
       ================================================ */

    // Resolver CONFIRMATION_API_ROOT de forma dinámica según el entorno
    const getApiBase = () => {
        if (window.location.origin && window.location.origin.startsWith('http')) {
            return window.location.origin;
        }
        return 'http://localhost:3001';
    };
    const CONFIRMATION_API_ROOT = getApiBase();

    // Helper seguro para localStorage (evita excepciones de seguridad en entornos restringidos)
    function safeGetItem(key, fallback = '') {
        try {
            return localStorage.getItem(key) || fallback;
        } catch (e) {
            console.warn('localStorage no está disponible:', e);
            return fallback;
        }
    }

    const params     = new URLSearchParams(window.location.search);
    const orderId    = params.get('order') || safeGetItem('last_order_id', null);
    let orderNum     = safeGetItem('last_order_number') || (orderId ? `#${orderId}` : '');
    let orderMethod  = safeGetItem('last_order_method', 'Depósito Bancario');
    let orderTotal   = parseFloat(safeGetItem('last_order_total', '0'));

    // Datos bancarios según método
    const BANK_DATA = {
        'Depósito Bancario':    { banco: 'BANPRO', cuenta: '1001-020-502133-2', titular: 'COMPUNIC S.A.', tipo: 'Cuenta Corriente (C$)' },
        'Transferencia Bancaria': { banco: 'BANPRO', cuenta: '1001-020-502133-2', titular: 'COMPUNIC S.A.', tipo: 'Cuenta Corriente (C$)' },
        'SINPE / Transferencia': { banco: 'BAC Nicaragua', cuenta: '357-001234-5', titular: 'COMPUNIC S.A.', tipo: 'Cuenta de Ahorros (C$)' }
    };

    let currentStatus = null;
    let selectedFile  = null;

    // ---- Actualizar hero según estado ----
    function updateHero(status) {
        const icon   = document.getElementById('heroIcon');
        const title  = document.getElementById('heroTitle');
        const sub    = document.getElementById('heroSubtitle');
        const badge  = document.getElementById('orderBadge');

        badge.textContent = orderNum;

        const isCod = orderMethod === 'Pago contra entrega' || orderMethod === 'Pago en Efectivo' || orderMethod === 'Pago en Efectivo (al retirar)';

        const map = {
            PENDIENTE:   { 
                icon: 'fas fa-receipt', 
                title: '¡Pedido Recibido!',     
                sub: isCod ? 'Tu pedido ha sido registrado y está listo para ser coordinado.' : 'Realiza el pago y sube tu comprobante para confirmar' 
            },
            VERIFICANDO: { icon: 'fas fa-search',  title: 'Verificando tu pago…',  sub: 'Nuestro equipo está revisando tu comprobante' },
            CONFIRMADO:  { icon: 'fas fa-check-circle', title: '¡Pedido Confirmado!', sub: 'Tu pago fue verificado. ¡Gracias por tu compra!' },
            RECHAZADO:   { icon: 'fas fa-times-circle', title: 'Problema con el Pago', sub: 'Hubo un problema al verificar tu comprobante' }
        };

        const info = map[status] || map.PENDIENTE;
        icon.innerHTML  = `<i class="${info.icon}"></i>`;
        title.textContent = info.title;
        sub.textContent   = info.sub;
    }

    // ---- Timeline ----
    function updateTimeline(status) {
        const stateMap = {
            PENDIENTE:   { steps: ['done','active','pending','pending'], lines: [false, false, false] },
            VERIFICANDO: { steps: ['done','done','active','pending'],   lines: [true, false, false] },
            CONFIRMADO:  { steps: ['done','done','done','done'],         lines: [true, true, true] },
            RECHAZADO:   { steps: ['done','done','done','pending'],      lines: [true, true, false] }
        };

        const cfg = stateMap[status] || stateMap.PENDIENTE;
        for (let i = 1; i <= 4; i++) {
            const el = document.getElementById(`ts${i}`);
            el.className = `ts-step ${cfg.steps[i-1]}`;
        }
        for (let i = 1; i <= 3; i++) {
            const el = document.getElementById(`tl${i}`);
            el.className = `ts-line${cfg.lines[i-1] ? ' done' : ''}`;
        }

        const isCod = orderMethod === 'Pago contra entrega' || orderMethod === 'Pago en Efectivo' || orderMethod === 'Pago en Efectivo (al retirar)';
        const badge = document.getElementById('statusBadge');
        const text  = document.getElementById('statusText');
        const labels = {
            PENDIENTE:   ['pendiente',   'fas fa-clock',        isCod ? 'Pendiente de entrega/retiro' : 'Esperando pago'],
            VERIFICANDO: ['verificando', 'fas fa-search',       'Verificando pago'],
            CONFIRMADO:  ['confirmado',  'fas fa-check-circle', 'Pedido confirmado'],
            RECHAZADO:   ['rechazado',   'fas fa-times-circle', 'Pago rechazado']
        };
        const lbl = labels[status] || labels.PENDIENTE;
        badge.className = `status-badge ${lbl[0]}`;
        badge.innerHTML = `<i class="${lbl[1]}"></i> ${lbl[2]}`;
    }

    // ---- Render contenido según estado ----
    function renderContent(status, data) {
        currentStatus = status;
        const mainContent = document.getElementById('mainContent');

        if (status === 'CONFIRMADO') {
            mainContent.innerHTML = `
                <div class="conf-card">
                    <div class="success-card">
                        <i class="fas fa-check-circle"></i>
                        <h3>¡Tu pedido está confirmado!</h3>
                        <p>Nos pondremos en contacto contigo pronto para coordinar la entrega o retiro en tienda.</p>
                        <div style="margin-top:16px; font-size:0.875rem; color:#64748b;">
                            Nº de Pedido: <strong>${orderNum}</strong>
                        </div>
                    </div>
                </div>
                <div class="conf-actions" style="justify-content:center;">
                    <a href="index.html" class="btn-primary-conf">
                        <i class="fas fa-store"></i> Seguir comprando
                    </a>
                </div>`;
            return;
        }

        if (status === 'RECHAZADO') {
            mainContent.innerHTML = `
                <div class="conf-card">
                    <div class="rejected-card">
                        <h4><i class="fas fa-exclamation-triangle"></i> Comprobante no aceptado</h4>
                        <p>Motivo proporcionado por nuestro equipo:</p>
                        <div class="motivo-box">${data?.NOTAS_PAGO || 'No se especificó un motivo.'}</div>
                        <p>Por favor, verifica el monto y sube un comprobante claro.</p>
                    </div>
                    <div style="margin-top:16px;">
                        ${renderUploadSection()}
                    </div>
                </div>`;
            bindUpload();
            return;
        }

        if (status === 'VERIFICANDO') {
            mainContent.innerHTML = `
                <div class="conf-card">
                    <div style="text-align:center; padding:20px 0;">
                        <i class="fas fa-search fa-2x" style="color:#3b82f6; margin-bottom:14px;"></i>
                        <h3 style="margin:0 0 8px; color:#1e3a5f;">Estamos verificando tu pago</h3>
                        <p style="color:#64748b; font-size:0.9rem;">Tu comprobante fue recibido. Nuestro equipo lo está revisando.</p>
                        <p style="color:#64748b; font-size:0.85rem; margin-top:6px;">⏱ Tiempo estimado: <strong>menos de 2 horas hábiles</strong></p>
                        <p style="color:#64748b; font-size:0.85rem;">📧 Te notificaremos por email cuando esté listo.</p>
                    </div>
                </div>
                <div class="conf-actions" style="justify-content:center;">
                    <a href="index.html" class="btn-outline-conf">
                        <i class="fas fa-store"></i> Seguir explorando
                    </a>
                </div>`;
            return;
        }

        // Estado PENDIENTE — mostrar instrucciones + subida
        const bank = BANK_DATA[orderMethod];
        const isCod = orderMethod === 'Pago contra entrega' || orderMethod === 'Pago en Efectivo' || orderMethod === 'Pago en Efectivo (al retirar)';

        let paySection = '';
        if (isCod) {
            paySection = `
                <div class="conf-card">
                    <h3><i class="fas fa-truck" style="color:#f97316;"></i> Pago al Retirar</h3>
                    <p style="color:#64748b; font-size:0.9rem;">
                        Nos pondremos en contacto contigo para coordinar el horario de entrega o retiro en tienda.<br>
                        Tendrás que pagar en efectivo o tarjeta al recibir tu pedido.
                    </p>
                    <div style="margin-top:16px; padding:12px; background:#fff7ed; border-radius:10px; font-size:0.85rem; color:#92400e;">
                        <i class="fas fa-phone"></i> Te llamaremos en las próximas <strong>2 horas hábiles</strong>.
                    </div>
                </div>`;
        } else {
            paySection = `
                <div class="conf-card">
                    <h3><i class="fas fa-university" style="color:#3b82f6;"></i> Instrucciones de Pago</h3>
                    <div class="pay-info-box">
                        <div class="bank-row"><span class="label">🏦 Banco</span><span class="value">${bank?.banco}</span></div>
                        <div class="bank-row"><span class="label">📁 Tipo de cuenta</span><span class="value">${bank?.tipo}</span></div>
                        <div class="bank-row"><span class="label">👤 Titular</span><span class="value">${bank?.titular}</span></div>
                        <div class="bank-row">
                            <span class="label">💳 Número de cuenta</span>
                            <div style="display:flex;align-items:center;gap:8px;">
                                <span class="value account" id="accountNum">${bank?.cuenta}</span>
                                <button class="copy-btn" onclick="copyAcc()"><i class="fas fa-copy"></i> Copiar</button>
                            </div>
                        </div>
                        <div class="bank-row"><span class="label">📋 Referencia</span><span class="value">${orderNum}</span></div>
                    </div>
                    <div class="total-display">Total a pagar: C$${orderTotal.toFixed(2)}</div>
                </div>
                <div class="conf-card">
                    <h3><i class="fas fa-upload" style="color:#6366f1;"></i> Sube tu Comprobante</h3>
                    <p style="color:#64748b; font-size:0.85rem; margin-bottom:16px;">
                        Toma una foto o captura de pantalla del comprobante de tu depósito o transferencia y súbela aquí.
                    </p>
                    ${renderUploadSection()}
                </div>`;
        }

        mainContent.innerHTML = paySection + `
            <div class="conf-actions" style="justify-content:center;">
                <a href="index.html" class="btn-outline-conf">
                    <i class="fas fa-store"></i> Seguir comprando
                </a>
            </div>`;

        bindUpload();
    }

    function renderUploadSection() {
        return `
            <div class="upload-zone" id="uploadZone">
                <input type="file" id="fileInput" accept="image/*,.pdf" onchange="handleFileSelect(event)">
                <div class="upload-icon"><i class="fas fa-cloud-upload-alt"></i></div>
                <div class="upload-title">Arrastra tu comprobante aquí</div>
                <div class="upload-sub">o haz click para seleccionar (JPG, PNG, PDF — máx 8MB)</div>
            </div>
            <div class="upload-preview" id="uploadPreview">
                <img id="previewImg" class="preview-img" src="" alt="Comprobante">
                <div class="file-name" id="fileName"></div>
            </div>
            <textarea class="notes-field" id="notasCliente" rows="2" placeholder="Nota opcional: ej. 'Depósito realizado el 2 jun a las 3:00 PM'"></textarea>
            <button class="upload-btn" id="uploadBtn" onclick="uploadComprobante()" disabled>
                <i class="fas fa-paper-plane"></i> Enviar Comprobante
            </button>`;
    }

    function bindUpload() {
        const zone = document.getElementById('uploadZone');
        if (!zone) return;

        zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragging'); });
        zone.addEventListener('dragleave', () => zone.classList.remove('dragging'));
        zone.addEventListener('drop', e => {
            e.preventDefault();
            zone.classList.remove('dragging');
            const file = e.dataTransfer.files[0];
            if (file) processFile(file);
        });
    }

    window.handleFileSelect = function(event) {
        const file = event.target.files[0];
        if (file) processFile(file);
    };

    function processFile(file) {
        if (file.size > 8 * 1024 * 1024) {
            showAlert('El archivo es demasiado grande (máx 8MB)', 'error');
            return;
        }
        selectedFile = file;

        const zone    = document.getElementById('uploadZone');
        const preview = document.getElementById('uploadPreview');
        const imgEl   = document.getElementById('previewImg');
        const nameEl  = document.getElementById('fileName');
        const btn     = document.getElementById('uploadBtn');

        zone.classList.add('has-file');
        nameEl.textContent = `📄 ${file.name}`;

        if (file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = e => { imgEl.src = e.target.result; };
            reader.readAsDataURL(file);
            imgEl.style.display = 'block';
        } else {
            imgEl.style.display = 'none';
        }

        preview.classList.add('visible');
        if (btn) btn.disabled = false;
    }

    window.uploadComprobante = async function() {
        if (!selectedFile || !orderId) return;

        const btn = document.getElementById('uploadBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enviando...';

        const formData = new FormData();
        formData.append('comprobante', selectedFile);
        const notas = document.getElementById('notasCliente')?.value || '';
        if (notas) formData.append('notas', notas);

        try {
            const res  = await fetch(`${CONFIRMATION_API_ROOT}/api/store/pedidos/${orderId}/comprobante`, {
                method: 'POST',
                body: formData
            });
            const data = await res.json();

            if (data.success) {
                showAlert('✅ ¡Comprobante enviado! Tu pago está siendo verificado.', 'success');
                setTimeout(() => loadOrderStatus(), 1500);
            } else {
                showAlert(data.error || 'Error al enviar el comprobante', 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> Enviar Comprobante';
            }
        } catch (err) {
            showAlert('Error de conexión. Intenta nuevamente.', 'error');
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-paper-plane"></i> Enviar Comprobante';
        }
    };

    window.copyAcc = function() {
        const el = document.getElementById('accountNum');
        if (!el) return;
        navigator.clipboard.writeText(el.textContent).then(() => showAlert('Número copiado 📋', 'success'));
    };

    function showAlert(msg, type) {
        const colors = { success: '#22c55e', error: '#ef4444', info: '#6366f1' };
        const n = document.createElement('div');
        n.style.cssText = `position:fixed;top:80px;right:20px;background:${colors[type]||colors.info};color:#fff;
            padding:14px 20px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.15);z-index:9999;
            font-weight:700;font-size:.9rem;max-width:360px;animation:slideIn .3s ease;`;
        n.textContent = msg;
        document.body.appendChild(n);
        setTimeout(() => { 
            n.style.opacity='0'; 
            n.style.transition='opacity .3s'; 
            setTimeout(()=>n.remove(), 300); 
        }, 4000);
    }

    async function loadOrderStatus() {
        if (!orderId) {
            document.getElementById('mainContent').innerHTML = `
                <div class="conf-card" style="text-align:center;">
                    <i class="fas fa-exclamation-triangle fa-2x" style="color:#f97316;"></i>
                    <p style="margin-top:12px; color:#64748b;">No se encontró información del pedido.</p>
                    <a href="index.html" class="btn-outline-conf" style="display:inline-flex; margin-top:16px;">
                        <i class="fas fa-store"></i> Ir a la tienda
                     </a>
                </div>`;
            return;
        }

        try {
            const res  = await fetch(`${CONFIRMATION_API_ROOT}/api/store/pedidos/${orderId}/estado`);
            const data = await res.json();

            if (data && data.success) {
                // Actualizar variables con los datos reales de la base de datos si están disponibles
                if (data.FACTURA) orderNum = data.FACTURA;
                if (data.METODO_PAGO) orderMethod = data.METODO_PAGO;
                if (data.TOTAL) orderTotal = parseFloat(data.TOTAL);
            }

            const status = data.ESTADO_PAGO || 'PENDIENTE';
            updateHero(status);
            updateTimeline(status);
            renderContent(status, data);
        } catch (err) {
            console.error('Error cargando estado:', err);
            // Fallback con datos locales
            updateHero('PENDIENTE');
            updateTimeline('PENDIENTE');
            renderContent('PENDIENTE', null);
        }
    }

    // Iniciar
    document.getElementById('orderBadge').textContent = orderNum;
    loadOrderStatus();
    </script>
</body>
</html>
