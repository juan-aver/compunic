<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - COMPUNIC Tienda Web</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-secondary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar Simple */
        .navbar-simple {
            background: var(--bg-card);
            padding: 1rem 20px;
            border-bottom: 1px solid rgba(86, 165, 221, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar-brand {
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 800;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .navbar-brand i { color: var(--primary); }

        .main-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 20px;
        }

        /* Login Card */
        .login-card {
            width: 100%;
            max-width: 450px;
            background: var(--bg-card);
            border-radius: 16px;
            padding: 2.5rem;
            border: 1px solid rgba(86, 165, 221, 0.1);
            box-shadow: var(--shadow-lg);
            text-align: center;
        }

        .login-header { margin-bottom: 2rem; }
        .login-header .icon {
            width: 60px; height: 60px;
            border-radius: 16px;
            background: rgba(86, 165, 221, 0.1);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1rem;
            font-size: 1.5rem; color: var(--primary);
        }

        .login-header h2 { font-size: 1.5rem; font-weight: 700; color: var(--text-primary); margin-bottom: 0.5rem; }
        .login-header p { color: var(--text-secondary); font-size: 0.95rem; }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .form-group { margin-bottom: 1.25rem; text-align: left; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-size: 0.85rem; color: var(--text-secondary); font-weight: 500; }
        
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper .input-icon { position: absolute; left: 14px; color: var(--text-muted); }
        .input-wrapper input {
            width: 100%;
            padding: 0.8rem 1rem 0.8rem 2.5rem;
            background: var(--bg-secondary);
            border: 1px solid rgba(86, 165, 221, 0.15);
            border-radius: 8px;
            font-size: 0.95rem;
            color: var(--text-primary);
            outline: none;
            transition: all 0.2s;
        }
        .input-wrapper input:focus {
            border-color: var(--primary);
            background: var(--bg-dark);
            box-shadow: 0 0 0 3px rgba(86, 165, 221, 0.1);
        }

        .btn-primary {
            width: 100%;
            padding: 0.9rem;
            background: var(--gradient-primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 1rem;
        }
        .btn-primary:hover {
            box-shadow: var(--shadow-colored);
        }

        .links {
            margin-top: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 0.9rem;
        }
        .links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }
        .links a:hover { color: var(--primary-light); }

        .error-message {
            color: var(--error);
            background: rgba(239, 68, 68, 0.1);
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
        }
    </style>
</head>

<body>
    <nav class="navbar-simple">
        <a href="index.html" class="navbar-brand">
            <i class="fas fa-bolt"></i> COMPUNIC
        </a>
        <a href="index.html" style="color: var(--text-secondary); text-decoration: none; font-weight: 500;">
            <i class="fas fa-store"></i> Volver a Tienda
        </a>
    </nav>

    <div class="main-container">
        <div class="login-card">
        <div class="login-header">
            <div class="icon"><i class="fas fa-user-plus"></i></div>
            <h2>Crear Cuenta</h2>
            <p>Únete a COMPUNIC y empieza a acumular puntos</p>
        </div>

        <form id="registerForm">
            <div class="form-row">
                <div class="form-group">
                    <label>Nombre</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" id="nombre" required placeholder="Juan">
                    </div>
                </div>
                <div class="form-group">
                    <label>Apellido</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" id="apellido" required placeholder="Pérez">
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Teléfono</label>
                <div class="input-wrapper">
                    <i class="fas fa-phone input-icon"></i>
                    <input type="tel" id="telefono" required placeholder="8888-8888">
                </div>
            </div>

            <div class="form-group">
                <label>Correo Electrónico</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" id="email" required placeholder="tu@correo.com">
                </div>
            </div>

            <div class="form-group">
                <label>Cédula de Identidad</label>
                <div class="input-wrapper">
                    <i class="fas fa-id-card input-icon"></i>
                    <input type="text" id="cedula" required placeholder="000-000000-0000A">
                </div>
            </div>

            <div class="form-group">
                <label>Contraseña</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
            </div>

            <div class="error-message" id="errorMsg"></div>

            <button type="submit" class="btn-primary">
                <i class="fas fa-user-check"></i> Registrarse
            </button>
        </form>

        <div class="links">
            <a href="login.html">¿Ya tienes cuenta? Inicia sesión</a>
        </div>
    </div>
    </div>

    <script src="../public/js/store-auth.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nombre = document.getElementById('nombre').value;
            const apellido = document.getElementById('apellido').value;
            const telefono = document.getElementById('telefono').value;
            const email = document.getElementById('email').value;
            const cedula = document.getElementById('cedula').value;
            const password = document.getElementById('password').value;
            const btn = e.target.querySelector('button');
            const errorMsg = document.getElementById('errorMsg');
            
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Procesando...';
            btn.disabled = true;
            errorMsg.style.display = 'none';

            const response = await StoreAuth.register({ nombre, apellido, telefono, email, cedula, password });
            
            if (response.success) {
                window.location.href = 'index.html';
            } else {
                errorMsg.textContent = response.message || 'Error al registrar la cuenta.';
                errorMsg.style.display = 'block';
                btn.innerHTML = '<i class="fas fa-user-check"></i> Registrarse';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
